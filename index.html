<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --night:#161B33; --deep:#0F1326; --card:#212844; --edge:#333C63;
  --ink:#ECEAF4; --dim:#8E96BC; --lamp:#FF9247; --lampglow:rgba(255,146,71,.28); --jade:#57D6B4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--deep)}
html,body{margin:0;padding:0}
body{background:var(--deep);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15px;line-height:1.6;max-width:520px;margin:0 auto;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  overscroll-behavior-y:none}
h1,h2,h3{font-family:"Noto Serif TC","Songti TC",serif;font-weight:600;margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px}

.crown{padding:calc(16px + env(safe-area-inset-top,0px)) 18px 16px;
  background:linear-gradient(180deg,var(--night),var(--deep));border-bottom:1px solid var(--edge)}
/* 加到主畫面時，某些 iOS 版本的 safe-area 會回傳 0，用 max() 兜底 */
html.pwa .crown{padding-top:max(calc(16px + env(safe-area-inset-top,0px)),28px)}
html.pwa nav{padding-bottom:max(env(safe-area-inset-bottom,0px),10px)}
.crown-top{display:flex;align-items:center;gap:10px}
.mark{font-family:"Noto Serif TC",serif;font-size:24px;letter-spacing:.12em;flex:none;line-height:1.2}
.title-note{color:var(--dim);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#4B5480;flex:none;align-self:center}
.dot.live{background:var(--jade);box-shadow:0 0 10px var(--jade)}
.lvline{display:flex;align-items:baseline;justify-content:space-between;margin-top:14px}
.lv{font-family:"Noto Serif TC",serif;font-size:19px}
.lv b{color:var(--lamp);font-size:25px;margin:0 3px}
.xpnum{color:var(--dim);font-size:12.5px;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:#2B3358;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lamp),#FFC46B);border-radius:3px;transition:width .5s cubic-bezier(.2,.8,.2,1)}

nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(22,27,51,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--edge);max-width:520px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom);z-index:500}
nav button{flex:1;padding:12px 0 14px;color:var(--dim);font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:4px}
nav button .g{font-size:17px;line-height:1}
nav button.on{color:var(--lamp)}
main{padding:18px}
.pane{display:none}.pane.on{display:block}

.act{display:block;width:100%;padding:14px;border-radius:12px;background:var(--lamp);color:#20140A;font-weight:700;text-align:center}
.act.ghost{background:transparent;border:1px solid var(--edge);color:var(--ink);font-weight:500}
.act.ig{background:linear-gradient(95deg,#C13584,#F56040,#FCAF45);color:#fff}
.empty{border:1px dashed var(--edge);border-radius:14px;padding:26px 20px;text-align:center;color:var(--dim)}
.empty strong{display:block;color:var(--ink);font-family:"Noto Serif TC",serif;font-size:16px;margin-bottom:6px;font-weight:600}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:24px 0 12px}
.sechead h2{font-size:16px}
.sechead span{color:var(--dim);font-size:12.5px;font-variant-numeric:tabular-nums}

.entry{display:flex;gap:12px;padding:12px;background:var(--card);border-radius:14px;margin-bottom:10px;align-items:center;width:100%;text-align:left}
.entry img{width:60px;height:60px;border-radius:10px;object-fit:cover;flex:none;background:#2B3358}
.entry .noimg{width:60px;height:60px;border-radius:10px;flex:none;background:#2B3358;display:flex;align-items:center;justify-content:center;font-size:22px}
.entry .body{flex:1;min-width:0}
.entry .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .meta{color:var(--dim);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;background:var(--lampglow);color:var(--lamp);font-size:11.5px;margin-right:6px}
.pill.ig{background:rgba(193,53,132,.28);color:#FF9EC7}

.tw{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.cty{padding:9px 2px;border-radius:9px;text-align:center;font-size:12.5px;background:#1C2240;color:#5A6291;border:1px solid transparent;transition:.35s}
.cty.lit{background:var(--lampglow);color:#FFC98F;border-color:rgba(255,146,71,.5);box-shadow:0 0 16px -4px var(--lampglow)}
#map{height:280px;border-radius:14px;margin-top:14px;background:var(--card)}
.leaflet-container{background:#0F1326}

.wish{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border-radius:12px;margin-bottom:8px}
.wish .tick{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--edge);flex:none;display:flex;align-items:center;justify-content:center;font-size:12px}
.wish.done .tick{background:var(--jade);border-color:var(--jade);color:#0F1326}
.wish.done .t{text-decoration:line-through;color:var(--dim)}
.addrow{display:flex;gap:8px;margin-bottom:14px}
.addrow input{flex:1;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--edge);color:var(--ink)}
.addrow button{padding:0 18px;border-radius:12px;background:var(--lamp);color:#20140A;font-weight:700}
.seg{display:flex;background:var(--card);border-radius:12px;padding:4px;margin-top:16px;border:1px solid var(--edge)}
.seg button{flex:1;padding:10px;border-radius:9px;color:var(--dim);font-size:14px;transition:.2s}
.seg button.on{background:var(--lamp);color:#20140A;font-weight:700}
.wish .t{flex:1;min-width:0;text-align:left}
.wish .t .wt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wish .t .wm{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.q{padding:14px;background:var(--card);border-radius:14px;margin-bottom:10px}
.q.done{background:linear-gradient(180deg,rgba(87,214,180,.13),var(--card));border:1px solid rgba(87,214,180,.3)}
.q .qt{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.q .rw{color:var(--lamp);font-size:12.5px;flex:none;font-variant-numeric:tabular-nums}
.q.done .rw{color:var(--jade)}
.q .qd{color:var(--dim);font-size:12.5px;margin-top:2px}
.q .qb{height:4px;border-radius:2px;background:#2B3358;margin-top:10px;overflow:hidden}
.q .qb i{display:block;height:100%;background:var(--lamp);border-radius:2px}
.q.done .qb i{background:var(--jade)}

.veil{position:fixed;inset:0;background:rgba(9,11,22,.72);display:none;align-items:flex-end;z-index:900}
.veil.on{display:flex}
.sheet{background:var(--night);width:100%;max-width:520px;margin:0 auto;border-radius:20px 20px 0 0;
  padding:22px 18px calc(22px + env(safe-area-inset-bottom));
  max-height:calc(88dvh - env(safe-area-inset-top));overflow:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet h2{font-size:18px;margin-bottom:4px}
.sheet label{display:block;color:var(--dim);font-size:12.5px;margin:14px 0 6px}
.sheet input,.sheet select,.sheet textarea{width:100%;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--edge);color:var(--ink)}
.sheet textarea{min-height:70px;resize:vertical}
.sheet .preview{width:100%;height:190px;object-fit:cover;border-radius:14px;background:var(--card);display:block}
.igbox{border-radius:14px;overflow:hidden;background:#fff;margin-top:12px}
.igbox iframe{display:block;width:100%;height:520px;border:0}
.hint{color:var(--dim);font-size:12px;margin-top:6px}
.two{display:flex;gap:10px;margin-top:20px}
.two button{flex:1}
.locrow{display:flex;gap:8px;align-items:center;margin-top:8px}
.locrow button{flex:none;padding:9px 14px;border-radius:10px;border:1px solid var(--edge);font-size:13px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:34px;letter-spacing:.22em;
  text-align:center;padding:18px;border-radius:14px;background:var(--card);border:1px dashed var(--edge);color:var(--lamp);margin-top:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--lamp);color:#20140A;
  padding:11px 20px;border-radius:30px;font-weight:700;font-size:14px;z-index:950;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;bottom:104px}
</style>

<div class="crown">
  <div class="crown-top">
    <span class="mark">戀途</span>
    <span class="title-note" id="sub">還沒有走過的地方</span>
    <span class="dot" id="dot" title="同步狀態"></span>
    <button id="btn-set" style="color:var(--dim);font-size:17px;padding:0 2px">⚙</button>
  </div>
  <div class="lvline">
    <span class="lv">Lv<b id="lv">1</b><span id="rank" style="font-size:14px;color:var(--dim)">新手旅伴</span></span>
    <span class="xpnum" id="xpnum">0 XP</span>
  </div>
  <div class="bar"><i id="xpbar" style="width:0%"></i></div>
</div>

<main>
  <section class="pane on" id="p-log"></section>
  <section class="pane" id="p-map"></section>
  <section class="pane" id="p-wish"></section>
  <section class="pane" id="p-quest"></section>
</main>

<nav>
  <button class="on" data-p="log"><span class="g">◈</span>足跡</button>
  <button data-p="map"><span class="g">◉</span>台灣</button>
  <button data-p="wish"><span class="g">✦</span>想去</button>
  <button data-p="quest"><span class="g">❖</span>任務</button>
</nav>

<div class="veil" id="veil"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="picker" accept="image/*" multiple hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js?v=0.6.0"></script>
<script>
const VERSION='0.6.0';   /* 改版本時同步改 sw.js 第一行的 CACHE 和 config.js?v= */

/* 加到主畫面 / 獨立視窗模式的判斷，供 CSS 兜底用 */
const PWA = window.navigator.standalone===true || matchMedia('(display-mode: standalone)').matches
         || matchMedia('(display-mode: fullscreen)').matches;
if(PWA) document.documentElement.classList.add('pwa');

/* ══════════ 縣市 ══════════ */
const CTY=[
 ['連江縣',26.1608,119.9490],['基隆市',25.1276,121.7392],['臺北市',25.0330,121.5654],
 ['新北市',24.9820,121.5800],['宜蘭縣',24.7021,121.7378],['金門縣',24.4368,118.3171],
 ['桃園市',24.9937,121.3010],['新竹市',24.8138,120.9675],['新竹縣',24.7033,121.1252],
 ['苗栗縣',24.5602,120.8214],['澎湖縣',23.5711,119.5793],['臺中市',24.1477,120.6736],
 ['花蓮縣',23.9871,121.6015],['彰化縣',24.0518,120.5161],['南投縣',23.9609,120.9719],
 ['雲林縣',23.7092,120.4313],['嘉義市',23.4801,120.4491],['嘉義縣',23.4518,120.2555],
 ['臺東縣',22.7583,121.1444],['臺南市',23.1417,120.2513],['高雄市',22.6273,120.3014],
 ['屏東縣',22.5519,120.5487]];
const NAMES=CTY.map(c=>c[0]);
const GRID=[
 ['連江縣',1,1,1],['基隆市',1,2,2],['臺北市',2,2,2],['新北市',3,2,2],['宜蘭縣',3,4,1],
 ['金門縣',4,1,1],['桃園市',4,2,2],['新竹市',5,2,1],['新竹縣',5,3,1],['苗栗縣',6,2,2],
 ['澎湖縣',7,1,1],['臺中市',7,2,2],['花蓮縣',7,4,1],['彰化縣',8,2,1],['南投縣',8,3,1],
 ['雲林縣',9,2,2],['嘉義市',10,2,1],['嘉義縣',10,3,1],['臺東縣',10,4,1],
 ['臺南市',11,2,2],['高雄市',12,2,2],['屏東縣',13,2,2]];
const ISLANDS=['澎湖縣','金門縣','連江縣'], EAST=['宜蘭縣','花蓮縣','臺東縣'];
function nearestCounty(lat,lng){let b=null,bd=1e9;
  for(const[n,a,g]of CTY){const d=(lat-a)**2+((lng-g)*.92)**2;if(d<bd){bd=d;b=n}}return b}

/* ══════════ 任務 ══════════ */
const QUESTS=[
 {id:'first',t:'第一次打卡',d:'記錄你們去過的第一個地方',xp:50,goal:1,f:s=>s.n},
 {id:'c10',t:'走過十個地方',d:'累積 10 次打卡',xp:150,goal:10,f:s=>s.n},
 {id:'c50',t:'走過五十個地方',d:'累積 50 次打卡',xp:600,goal:50,f:s=>s.n},
 {id:'ph30',t:'三十張回憶',d:'存下 30 張照片',xp:200,goal:30,f:s=>s.photos},
 {id:'ig1',t:'第一則貼文',d:'從 IG 分享一則貼文進來',xp:80,goal:1,f:s=>s.igs},
 {id:'ig10',t:'十則貼文',d:'串起 10 則 IG 貼文',xp:350,goal:10,f:s=>s.igs},
 {id:'ct3',t:'點亮三個縣市',d:'足跡跨越 3 個縣市',xp:200,goal:3,f:s=>s.cities.size},
 {id:'ct10',t:'點亮十個縣市',d:'足跡跨越 10 個縣市',xp:500,goal:10,f:s=>s.cities.size},
 {id:'ct22',t:'點亮整座島',d:'22 個縣市全部走過',xp:2000,goal:22,f:s=>s.cities.size},
 {id:'east',t:'到東岸走走',d:'宜蘭、花蓮或臺東任一個',xp:150,goal:1,f:s=>EAST.some(c=>s.cities.has(c))?1:0},
 {id:'isle',t:'踏上離島',d:'澎湖、金門或馬祖任一個',xp:300,goal:1,f:s=>ISLANDS.some(c=>s.cities.has(c))?1:0},
 {id:'m4',t:'這個月出門四次',d:'同一個月內 4 個不同日子',xp:150,goal:4,f:s=>s.thisMonth},
 {id:'w5',t:'許願五個地方',d:'想去清單放進 5 個地方',xp:100,goal:5,f:s=>s.wishTotal},
 {id:'w3',t:'實現三個願望',d:'把想去的地方變成去過的',xp:250,goal:3,f:s=>s.wishDone},
 {id:'wig',t:'蒐集口袋名單',d:'從 IG 存 5 個想去的地方',xp:180,goal:5,f:s=>s.wishIg},
 {id:'pair',t:'兩個人一起',d:'把另一半也拉進來',xp:400,goal:1,f:s=>s.paired?1:0},
];
const RANKS=[[1,'新手旅伴'],[3,'週末探險家'],[5,'島內漫遊者'],[8,'縣道熟客'],[12,'台灣通'],[16,'傳說級情侶']];

/* ══════════ 狀態 ══════════ */
let DB={checkins:[],wishlist:[]};
let sb=null, ME={uid:null,coupleId:null,code:null,name:'',mates:[]}, LIVE=false;
const photoCache={};
const $=s=>document.querySelector(s);
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),2600)}

const cache={
  get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},
  set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},
  del:k=>{try{localStorage.removeItem(k)}catch(e){}}
};
const saveLocal=()=>cache.set('lovemap:data',JSON.stringify(DB));

/* ══════════ 同步 ══════════ */
async function initSync(){
  const C=window.LIANTO_CONFIG||{};
  if(!C.url||!C.anonKey||typeof supabase==='undefined')return 'local';
  sb=supabase.createClient(C.url,C.anonKey,{auth:{persistSession:true,autoRefreshToken:true}});
  let {data:{session}}=await sb.auth.getSession();
  if(!session){
    const r=await sb.auth.signInAnonymously();
    if(r.error){console.warn(r.error);return 'local'}
    session=r.data.session;
  }
  ME.uid=session.user.id;
  const {data:prof}=await sb.from('profiles').select('couple_id').eq('id',ME.uid).maybeSingle();
  if(!prof||!prof.couple_id)return 'nocouple';
  await adopt(prof.couple_id);
  return 'live';
}
async function adopt(coupleId){
  ME.coupleId=coupleId;
  const {data:cp}=await sb.from('couples').select('invite_code').eq('id',coupleId).maybeSingle();
  ME.code=cp&&cp.invite_code;
  LIVE=true;
  await loadMates();
  await pull();
  listen();
}
async function loadMates(){
  if(!LIVE)return;
  const {data}=await sb.from('profiles').select('id,display_name').eq('couple_id',ME.coupleId);
  ME.mates=(data||[]).map(r=>({id:r.id,name:r.display_name||''}));
  const me=ME.mates.find(m=>m.id===ME.uid);
  ME.name=me?me.name:'';
}
const nameOf=id=>{
  if(!id)return '';
  if(id===ME.uid)return ME.name||'你';
  const m=ME.mates.find(x=>x.id===id);
  return m?(m.name||'另一半'):'';
};
const partnerName=()=>{
  const p=ME.mates.find(m=>m.id!==ME.uid);
  return p?(p.name||'另一半'):null;
};
function listen(){
  sb.channel('lianto:'+ME.coupleId)
    .on('postgres_changes',{event:'*',schema:'public',table:'checkins',filter:'couple_id=eq.'+ME.coupleId},()=>pull().then(render))
    .on('postgres_changes',{event:'*',schema:'public',table:'wishes',filter:'couple_id=eq.'+ME.coupleId},()=>pull().then(render))
    .on('postgres_changes',{event:'*',schema:'public',table:'profiles',filter:'couple_id=eq.'+ME.coupleId},async()=>{
        const before=ME.mates.length;
        await loadMates(); render();
        if(ME.mates.length>before){const p=partnerName();if(p)toast(p+' 加入了')}
      })
    .subscribe();
}
async function pull(){
  const [a,b]=await Promise.all([
    sb.from('checkins').select('*').order('date',{ascending:false}),
    sb.from('wishes').select('*').order('updated_at',{ascending:false})
  ]);
  if(a.error||b.error){console.warn(a.error||b.error);return}
  DB.checkins=(a.data||[]).map(r=>({id:r.id,name:r.name,county:r.county,date:r.date,note:r.note||'',
    lat:r.lat,lng:r.lng,igs:r.igs||[],photos:r.photos||0,photo_path:r.photo_path,
    hasPhoto:!!r.photo_path,by:r.created_by}));
  DB.wishlist=(b.data||[]).map(r=>({id:r.id,title:r.title,done:!!r.done,
    county:r.county||'',note:r.note||'',ig:r.ig||null,by:r.created_by}));
  saveLocal();
  DB.checkins.forEach(c=>{if(c.hasPhoto)hydratePhoto(c)});
}
const row=c=>({id:c.id,couple_id:ME.coupleId,name:c.name,county:c.county,date:c.date,note:c.note,
  lat:c.lat??null,lng:c.lng??null,igs:c.igs||[],photos:c.photos||0,photo_path:c.photo_path||null,
  created_by:c.by||ME.uid,updated_at:new Date().toISOString()});

async function pushCheckin(c){ if(LIVE) await sb.from('checkins').upsert(row(c)) }

async function uploadPhoto(id,dataUrl){
  if(!LIVE||!dataUrl)return null;
  try{
    const blob=await (await fetch(dataUrl)).blob();
    const path=`${ME.coupleId}/${id}.jpg`;
    const {error}=await sb.storage.from('memories').upload(path,blob,{contentType:'image/jpeg',upsert:true});
    return error?null:path;
  }catch(e){return null}
}
async function hydratePhoto(c){
  if(photoCache[c.id])return paint(c.id,photoCache[c.id]);
  const v=cache.get('lovemap:photo:'+c.id);
  if(v){photoCache[c.id]=v;return paint(c.id,v)}
  if(!LIVE||!c.photo_path)return;
  try{
    const {data}=await sb.storage.from('memories').createSignedUrl(c.photo_path,3600);
    if(!data||!data.signedUrl)return;
    const blob=await (await fetch(data.signedUrl)).blob();
    const b64=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(blob)});
    photoCache[c.id]=b64;cache.set('lovemap:photo:'+c.id,b64);paint(c.id,b64);
  }catch(e){}
}
function paint(id,src){
  document.querySelectorAll('[data-photo="'+id+'"]').forEach(el=>{
    if(el.tagName==='IMG')return;
    const img=document.createElement('img');img.dataset.photo=id;img.src=src;el.replaceWith(img)});
}

 '新竹':'新竹縣','苗栗':'苗栗縣','台中':'臺中市','臺中':'臺中市','彰化':'彰化縣','南投':'南投縣',

function guessCounty(text){
  if(!text)return null;

}
/* 從文案第一行猜地點名稱：抓引號、書名號裡的字，或第一個短句 */
function guessPlace(cap){
  if(!cap)return '';
  const q=cap.match(/[「『【《\u201c]([^」』】》\u201d]{2,20})[」』】》\u201d]/);
  if(q)return q[1].trim();
  const line=cap.split(/[\n|｜]/)[0].replace(/#\S+/g,'').trim();
  if(line&&line.length<=20)return line;
  const seg=line.split(/[，,。！!？?・\s]/).filter(x=>x.length>=2&&x.length<=14)[0];
  return seg||'';
}

/* ══════════ EXIF ══════════ */
function readExif(buf){
  try{const v=new DataView(buf);
    if(v.getUint16(0)!==0xFFD8)return null;
    let o=2;
    while(o<v.byteLength-4){
      const m=v.getUint16(o); if((m&0xFF00)!==0xFF00)break;
      const len=v.getUint16(o+2);
      if(m===0xFFE1&&v.getUint32(o+4)===0x45786966)return tiff(v,o+10);
      o+=2+len;
    }}catch(e){}
  return null;
}
function tiff(v,ts){
  const le=v.getUint16(ts)===0x4949;
  if(v.getUint16(ts+2,le)!==42)return null;
  const t0=ifd(v,ts,ts+v.getUint32(ts+4,le),le),out={};
  if(t0[0x8769]){const te=ifd(v,ts,ts+v.getUint32(t0[0x8769].d,le),le);
    if(te[0x9003])out.taken=str(v,te[0x9003])}
  if(t0[0x8825]){
    const g=ifd(v,ts,ts+v.getUint32(t0[0x8825].d,le),le);
    if(g[2]&&g[4]){
      const la=arr(v,g[2],le),lo=arr(v,g[4],le);
      let lat=la[0]+la[1]/60+la[2]/3600,lng=lo[0]+lo[1]/60+lo[2]/3600;
      if(g[1]&&str(v,g[1])[0]==='S')lat=-lat;
      if(g[3]&&str(v,g[3])[0]==='W')lng=-lng;
      if(isFinite(lat)&&isFinite(lng)){out.lat=lat;out.lng=lng}
    }}
  return out;
}
function ifd(v,ts,off,le){
  const n=v.getUint16(off,le),m={};
  for(let i=0;i<n;i++){
    const e=off+2+i*12,tag=v.getUint16(e,le),type=v.getUint16(e+2,le),cnt=v.getUint32(e+4,le);
    const S={1:1,2:1,3:2,4:4,5:8,7:1,9:4,10:8}[type]||1;
    m[tag]={type,cnt,d:(S*cnt>4)?ts+v.getUint32(e+8,le):e+8};
  } return m;
}
function str(v,e){let s='';for(let i=0;i<e.cnt;i++){const c=v.getUint8(e.d+i);if(!c)break;s+=String.fromCharCode(c)}return s}
function arr(v,e,le){const r=[];for(let i=0;i<e.cnt;i++){
  if(e.type===5)r.push(v.getUint32(e.d+i*8,le)/v.getUint32(e.d+i*8+4,le));
  else if(e.type===3)r.push(v.getUint16(e.d+i*2,le));
  else r.push(v.getUint32(e.d+i*4,le));} return r}

function shrink(file){
  return new Promise(res=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{const M=760,s=Math.min(1,M/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.72))};
    img.onerror=()=>{URL.revokeObjectURL(url);res(null)};
    img.src=url;
  });
}
async function lookupName(lat,lng){
  try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=16&lat=${lat}&lon=${lng}&accept-language=zh-TW`);
    const a=(await r.json()).address||{};
    return a.tourism||a.attraction||a.leisure||a.building||a.road||a.suburb||a.village||a.town||''
  }catch(e){return ''}
}

/* ══════════ 照片打卡 ══════════ */
$('#picker').onchange=async ev=>{
  const files=[...ev.target.files];ev.target.value='';
  if(!files.length)return;
  toast('讀取照片…');
  const shots=[];
  for(const f of files){
    const ex=readExif(await f.arrayBuffer())||{};
    const dataUrl=await shrink(f);
    let when=null;
    if(ex.taken){const p=ex.taken.match(/(\d{4}):(\d{2}):(\d{2})/);if(p)when=`${p[1]}-${p[2]}-${p[3]}`}
    if(!when)when=new Date(f.lastModified||Date.now()).toISOString().slice(0,10);
    shots.push({lat:ex.lat,lng:ex.lng,when,dataUrl});
  }
  const groups=[];
  for(const s of shots){
    const g=groups.find(g=>g.when===s.when&&(!s.lat||!g.lat||dist(g.lat,g.lng,s.lat,s.lng)<5));
    if(g){g.shots.push(s);if(!g.lat&&s.lat){g.lat=s.lat;g.lng=s.lng}}
    else groups.push({when:s.when,lat:s.lat,lng:s.lng,shots:[s]});
  }
  for(const g of groups) await sheetPhoto(g);
};
const dist=(a,b,c,d)=>Math.hypot((a-c)*111,(b-d)*102);

function sheetPhoto(g){
  return new Promise(resolve=>{
    const cty=g.lat?nearestCounty(g.lat,g.lng):'臺北市';
    const cover=g.shots[0].dataUrl;
    $('#sheet').innerHTML=`
      <h2>這是哪裡？</h2>
      ${cover?`<img class="preview" src="${cover}" style="margin-top:12px">`:''}
      <label>地點名稱</label><input id="f-name" placeholder="例如：象鼻岩">
      <label>縣市${g.lat?'（從照片位置猜的，可以改）':'（照片沒有位置資訊，自己選）'}</label>
      <select id="f-cty">${NAMES.map(n=>`<option ${n===cty?'selected':''}>${n}</option>`).join('')}</select>
      <label>日期</label><input id="f-date" type="date" value="${g.when}">
      <label>想寫點什麼</label><textarea id="f-note" placeholder="那天的天氣、吃了什麼、誰先笑出來"></textarea>
      <div class="hint">${g.shots.length} 張照片，封面會存起來</div>
      <div class="two"><button class="act ghost" id="f-cancel">不要了</button><button class="act" id="f-ok">記下來</button></div>`;
    $('#veil').classList.add('on');
    if(g.lat)lookupName(g.lat,g.lng).then(n=>{const i=$('#f-name');if(n&&i&&!i.value)i.value=n});
    const done=async ok=>{
      if(ok){
        const id=uid('c');
        const c={id,name:$('#f-name').value.trim()||$('#f-cty').value,county:$('#f-cty').value,
          date:$('#f-date').value,note:$('#f-note').value.trim(),lat:g.lat,lng:g.lng,
          photos:g.shots.length,hasPhoto:!!cover,igs:[],by:ME.uid};
        if(cover){photoCache[id]=cover;cache.set('lovemap:photo:'+id,cover);c.photo_path=await uploadPhoto(id,cover)}
        DB.checkins.unshift(c);saveLocal();await pushCheckin(c);
        const b=level().lv;render();const a=level().lv;
        toast(a>b?`升到 Lv.${a}！`:`+${20+g.shots.length*5} XP`);
      }
      $('#veil').classList.remove('on');resolve();
    };
    $('#f-ok').onclick=()=>done(true);
    $('#f-cancel').onclick=()=>done(false);
  });
}
function manualCheckin(prefill){
  sheetPhoto({when:new Date().toISOString().slice(0,10),shots:[{dataUrl:null}]});
  setTimeout(()=>{const i=$('#f-name');if(i&&prefill)i.value=prefill;
    if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{
      const s=$('#f-cty');if(s)s.value=nearestCounty(p.coords.latitude,p.coords.longitude)},()=>{})},40);
}

/* ══════════ 詳情 ══════════ */
function sheetDetail(id){
  const c=DB.checkins.find(x=>x.id===id);if(!c)return;
  $('#sheet').innerHTML=`
    <h2>${esc(c.name)}</h2>
    <div class="hint">${c.lat?`${c.lat.toFixed(4)}, ${c.lng.toFixed(4)}`:'沒有座標'}${(LIVE&&nameOf(c.by))?'・'+esc(nameOf(c.by))+' 記的':''}</div>
    ${photoCache[id]?`<img class="preview" src="${photoCache[id]}" style="margin-top:14px">`:''}

    <label>地點名稱</label><input id="d-name" value="${esc(c.name)}">
    <label>縣市</label>
    <select id="d-cty">${NAMES.map(n=>`<option ${n===c.county?'selected':''}>${n}</option>`).join('')}</select>
    <label>日期</label><input id="d-date" type="date" value="${c.date||''}">
    <label>備註</label><textarea id="d-note">${esc(c.note||'')}</textarea>

    ${(c.igs||[]).map(k=>`<div class="igbox"><iframe src="${igEmbed(k)}" loading="lazy"></iframe></div>`).join('')}

    <div class="two">
      <button class="act ghost" id="d-close">關閉</button>
      <button class="act" id="d-save">存變更</button>
    </div>
    <button class="act ghost" id="d-ig" style="margin-top:10px">加一則 IG 貼文</button>
    <button class="act ghost" id="d-del" style="margin-top:10px;color:#FF8080;border-color:#5A2B2B">刪掉這次打卡</button>`;
  $('#veil').classList.add('on');
  $('#d-close').onclick=()=>$('#veil').classList.remove('on');
  $('#d-save').onclick=async()=>{
    c.name=$('#d-name').value.trim()||c.name;
    c.county=$('#d-cty').value;
    c.date=$('#d-date').value||c.date;
    c.note=$('#d-note').value.trim();
    saveLocal();render();await pushCheckin(c);
    $('#veil').classList.remove('on');toast('改好了');
  };
  $('#d-ig').onclick=()=>{$('#veil').classList.remove('on');pasteIg()};
  $('#d-del').onclick=async()=>{
    if(!confirm('刪掉這次打卡？'))return;
    DB.checkins=DB.checkins.filter(x=>x.id!==id);
    cache.del('lovemap:photo:'+id);delete photoCache[id];
    saveLocal();await dropCheckin(id);
    $('#veil').classList.remove('on');render();
  };
}

/* ══════════ 統計 ══════════ */
function stats(){
  const cities=new Set(DB.checkins.map(c=>c.county));
  return{n:DB.checkins.length,cities,
    photos:DB.checkins.reduce((a,c)=>a+(c.photos||0),0),
    igs:DB.checkins.reduce((a,c)=>a+((c.igs||[]).length),0),
    thisMonth:(()=>{const mk={};DB.checkins.forEach(c=>{const m=(c.date||'').slice(0,7);(mk[m]=mk[m]||new Set()).add(c.date)});
      return Math.max(0,...Object.values(mk).map(s=>s.size))})(),
    wishTotal:DB.wishlist.length,wishDone:DB.wishlist.filter(w=>w.done).length,
    wishIg:DB.wishlist.filter(w=>w.ig).length,
    paired:ME.mates.length>=2};
}
function totalXp(){const s=stats();let x=s.n*20+s.photos*5+s.igs*10;
  QUESTS.forEach(q=>{if(q.f(s)>=q.goal)x+=q.xp});return x}
function level(){
  const xp=totalXp(),lv=Math.max(1,1+Math.floor(Math.pow(xp/100,2/3)));
  const cur=Math.round(100*Math.pow(lv-1,1.5)),next=Math.round(100*Math.pow(lv,1.5));
  let rank='新手旅伴';RANKS.forEach(([n,r])=>{if(lv>=n)rank=r});
  return{xp,lv,cur,next,rank,pct:Math.min(100,(xp-cur)/(next-cur)*100)};
}

/* ══════════ 畫面 ══════════ */
function render(){
  const L=level(),s=stats();
  $('#lv').textContent=L.lv;$('#rank').textContent=L.rank;
  $('#xpnum').textContent=`${L.xp} / ${L.next} XP`;
  $('#xpbar').style.width=L.pct+'%';
  const mate=LIVE?partnerName():null;
  const base=s.n?`${s.n} 個地方・點亮 ${s.cities.size}/22 縣市`:'還沒有走過的地方';
  $('#sub').textContent=mate?`和 ${mate} ・ ${base}`:base;
  $('#dot').title=LIVE?(mate?`和 ${mate} 同步中`:'已連線，還沒有另一半加入'):'單機模式';
  $('#dot').classList.toggle('live',LIVE);
  drawLog();drawMap();drawWish();drawQuest();
}
function drawLog(){
  const el=$('#p-log');
  el.innerHTML=`
    <button class="act ig" id="btn-ig">貼上 IG 連結</button>
    <button class="act" id="btn-photo" style="margin-top:10px">從照片新增打卡</button>
    <button class="act ghost" id="btn-manual" style="margin-top:10px">手動記一個地方</button>
    <div class="sechead"><h2>足跡</h2><span>${DB.checkins.length}</span></div>
    ${DB.checkins.length?DB.checkins.map(c=>`
      <button class="entry" data-open="${c.id}">
        ${c.hasPhoto?(photoCache[c.id]?`<img data-photo="${c.id}" src="${photoCache[c.id]}">`:`<div class="noimg" data-photo="${c.id}">◌</div>`)
                    :`<div class="noimg">${(c.igs||[]).length?'◈':'◇'}</div>`}
        <div class="body">
          <div class="name">${esc(c.name)}</div>
          <div class="meta"><span class="pill">${c.county}</span>${(c.igs||[]).length?`<span class="pill ig">IG ${c.igs.length}</span>`:''}${c.date}${c.photos?' ・'+c.photos+' 張':''}${(LIVE&&ME.mates.length>1&&nameOf(c.by))?' ・'+esc(nameOf(c.by)):''}</div>
          ${c.note?`<div class="meta" style="margin-top:2px">${esc(c.note)}</div>`:''}
        </div>
      </button>`).join(''):
      `<div class="empty"><strong>從一則貼文或一張照片開始</strong>在 IG 按分享選「戀途」，或直接把連結貼進來。</div>`}`;
  $('#btn-ig').onclick=pasteIg;
  $('#btn-photo').onclick=()=>$('#picker').click();
  $('#btn-manual').onclick=()=>manualCheckin();
  el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>sheetDetail(b.dataset.open));
}
let map,layer;
function drawMap(){
  const lit=new Set(DB.checkins.map(c=>c.county)),el=$('#p-map');
  if(!el.dataset.built){
    el.innerHTML=`<div class="sechead" style="margin-top:0"><h2>點亮台灣</h2><span id="litn"></span></div>
      <div class="tw" id="tw"></div>
      <div class="sechead"><h2>去過的地方</h2></div><div id="map"></div>`;
    el.dataset.built='1';
  }
  $('#litn').textContent=`${lit.size} / 22`;
  $('#tw').innerHTML=GRID.map(([n,r,c,w])=>
    `<div class="cty ${lit.has(n)?'lit':''}" style="grid-row:${r};grid-column:${c}/span ${w}">${n.replace(/[縣市]$/,'')}</div>`).join('');
  const pts=DB.checkins.filter(c=>c.lat);
  if(typeof L==='undefined'){$('#map').innerHTML='<div class="empty" style="border:0">地圖離線中，縣市進度照常記錄。</div>';return}
  if(!map){
    map=L.map('map',{attributionControl:false}).setView([23.7,121],7);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:18}).addTo(map);
    layer=L.layerGroup().addTo(map);
  }
  layer.clearLayers();
  pts.forEach(c=>L.circleMarker([c.lat,c.lng],{radius:7,color:'#FF9247',fillColor:'#FF9247',fillOpacity:.8,weight:2})
    .bindPopup(`<b>${esc(c.name)}</b><br>${c.date}`).addTo(layer));
  if(pts.length)setTimeout(()=>{map.invalidateSize();map.fitBounds(pts.map(c=>[c.lat,c.lng]),{padding:[40,40],maxZoom:12})},60);
}
function drawWish(){
  const el=$('#p-wish');
  const todo=DB.wishlist.filter(w=>!w.done), done=DB.wishlist.filter(w=>w.done);
  const row=w=>`
    <div class="wish ${w.done?'done':''}">
      <div class="tick" data-tick="${w.id}">${w.done?'✓':''}</div>
      <button class="t" data-wopen="${w.id}">
        <div class="wt">${esc(w.title)}</div>
        <div class="wm">${w.county?`<span class="pill">${w.county}</span>`:''}${w.ig?`<span class="pill ig">IG</span>`:''}${(LIVE&&ME.mates.length>1&&nameOf(w.by))?esc(nameOf(w.by))+'存的 ':''}${esc(w.note||'')}</div>
      </button>
      <button data-wdel="${w.id}" style="color:var(--dim);padding:8px">✕</button>
    </div>`;
  el.innerHTML=`
    <button class="act ig" id="w-fromig">從 IG 存一個想去的地方</button>
    <div class="addrow" style="margin-top:14px"><input id="w-in" placeholder="或直接打字"><button id="w-add">加</button></div>
    ${DB.wishlist.length?`
      ${todo.length?`<div class="sechead"><h2>想去</h2><span>${todo.length}</span></div>${todo.map(row).join('')}`:''}
      ${done.length?`<div class="sechead"><h2>去過了</h2><span>${done.length}</span></div>${done.map(row).join('')}`:''}`
    :`<div class="empty"><strong>看到不錯的就先丟進來</strong>在 IG 上看到推薦的景點，按分享選「戀途」，選「想去」就存下來了。</div>`}`;

  $('#w-fromig').onclick=pasteIg;
  const add=async()=>{const v=$('#w-in').value.trim();if(!v)return;
    const w={id:uid('w'),title:v,done:false,county:'',note:'',ig:null,by:ME.uid};
    DB.wishlist.unshift(w);saveLocal();render();await pushWish(w)};
  $('#w-add').onclick=add;
  $('#w-in').onkeydown=e=>{if(e.key==='Enter')add()};
  el.querySelectorAll('[data-wopen]').forEach(b=>b.onclick=()=>sheetWish(b.dataset.wopen));
  el.querySelectorAll('[data-tick]').forEach(b=>b.onclick=()=>toggleWish(b.dataset.tick));
  el.querySelectorAll('[data-wdel]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.wdel;
    DB.wishlist=DB.wishlist.filter(x=>x.id!==id);saveLocal();render();await dropWish(id)});
}

async function toggleWish(id){
  const w=DB.wishlist.find(x=>x.id===id); if(!w)return;
  w.done=!w.done; saveLocal(); render(); await pushWish(w);
  if(!w.done)return;
  if(!confirm(`「${w.title}」去過了，記成一次打卡嗎？`))return;
  const c={id:uid('c'),name:w.title,county:w.county||'臺北市',
    date:new Date().toISOString().slice(0,10),note:w.note||'',
    lat:null,lng:null,photos:0,hasPhoto:false,igs:w.ig?[w.ig]:[],by:ME.uid};
  DB.checkins.unshift(c);saveLocal();
  if(navigator.geolocation)navigator.geolocation.getCurrentPosition(async p=>{
    c.lat=p.coords.latitude;c.lng=p.coords.longitude;
    if(!w.county)c.county=nearestCounty(c.lat,c.lng);
    saveLocal();render();await pushCheckin(c);
  },async()=>{await pushCheckin(c)});
  const b=level().lv;render();const a=level().lv;
  toast(a>b?`升到 Lv.${a}！`:'記成打卡了');
  document.querySelector('nav button[data-p="log"]').click();
}

function sheetWish(id){
  const w=DB.wishlist.find(x=>x.id===id); if(!w)return;
  $('#sheet').innerHTML=`
    <h2>${esc(w.title)}</h2>
    <div class="hint">${w.county?`<span class="pill">${w.county}</span>`:''}${w.done?'已經去過':'還沒去'}</div>
    ${w.ig?`<div class="igbox"><iframe src="${igEmbed(w.ig)}" loading="lazy"></iframe></div>`:''}
    <label>地點名稱</label><input id="e-name" value="${esc(w.title)}">
    <label>大概在哪</label>
    <select id="e-cty"><option value="">還不確定</option>${NAMES.map(n=>`<option ${n===w.county?'selected':''}>${n}</option>`).join('')}</select>
    <label>備註</label><textarea id="e-note">${esc(w.note||'')}</textarea>
    <div class="two">
      <button class="act ghost" id="e-close">關閉</button>
      <button class="act" id="e-save">存變更</button>
    </div>
    ${w.done?'':'<button class="act ghost" id="e-go" style="margin-top:10px;border-color:var(--jade);color:var(--jade)">我們去過了</button>'}`;
  $('#veil').classList.add('on');
  $('#e-close').onclick=()=>$('#veil').classList.remove('on');
  $('#e-save').onclick=async()=>{
    w.title=$('#e-name').value.trim()||w.title;
    w.county=$('#e-cty').value; w.note=$('#e-note').value.trim();
    saveLocal();render();await pushWish(w);
    $('#veil').classList.remove('on');toast('改好了');
  };
  const g=$('#e-go');
  if(g)g.onclick=()=>{$('#veil').classList.remove('on');toggleWish(id)};
}

function drawQuest(){
  const s=stats();
  const rows=QUESTS.map(q=>({q,p:Math.min(q.f(s),q.goal),done:q.f(s)>=q.goal}))
    .sort((a,b)=>(a.done-b.done)||(b.p/b.q.goal-a.p/a.q.goal));
  $('#p-quest').innerHTML=`
    <div class="sechead" style="margin-top:0"><h2>任務</h2><span>${rows.filter(r=>r.done).length} / ${QUESTS.length}</span></div>
    ${rows.map(({q,p,done})=>`<div class="q ${done?'done':''}">
      <div class="qt"><b>${q.t}</b><span class="rw">${done?'✓ ':'+'}${q.xp} XP</span></div>
      <div class="qd">${q.d}</div><div class="qb"><i style="width:${p/q.goal*100}%"></i></div>
      <div class="qd" style="margin-top:5px;font-variant-numeric:tabular-nums">${p} / ${q.goal}</div></div>`).join('')}`;
}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+b.dataset.p));
  if(b.dataset.p==='map'&&map)setTimeout(()=>map.invalidateSize(),60);
});
$('#veil').onclick=e=>{if(e.target.id==='veil')$('#veil').classList.remove('on')};
if('serviceWorker'in navigator){
  navigator.serviceWorker.register('sw.js').then(r=>{
    r.update();
    r.addEventListener('updatefound',()=>{
      const w=r.installing;
      if(!w)return;
      w.addEventListener('statechange',()=>{
        if(w.state==='installed'&&navigator.serviceWorker.controller)toast('有新版本，重開就會更新');
      });
    });
  }).catch(()=>{});
}
boot();
</script>
</html>
